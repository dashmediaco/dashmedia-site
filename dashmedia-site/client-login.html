<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080b12">
<title>Client Login | Dash Media</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
:root{color-scheme:dark;--ink:#f5f7fb;--muted:#aab4c5;--blue:#6e9aff;--line:rgba(202,215,242,.14)}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{position:relative;isolation:isolate;min-height:100vh;min-height:100svh;overflow-x:hidden;background:#080b12;color:var(--ink);font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body:before{position:fixed;inset:0;z-index:-2;content:"";pointer-events:none;opacity:.2;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:68px 68px;mask-image:linear-gradient(to bottom,#000,transparent 88%)}
body:after{position:fixed;z-index:-1;content:"";width:28rem;height:28rem;left:50%;top:12%;transform:translateX(-50%);border-radius:50%;pointer-events:none;background:rgba(31,83,190,.18);filter:blur(100px);animation:glow 11s ease-in-out infinite alternate}
.page{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}.topbar,footer{width:min(100% - 48px,1240px);margin:0 auto;display:flex;align-items:center;justify-content:space-between}.topbar{height:82px;border-bottom:1px solid rgba(255,255,255,.07)}.brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none}.brand img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(34,91,197,.28))}.brand-name{font-size:14px;font-weight:800;letter-spacing:.16em;line-height:1}.brand-name span{display:block;margin-top:5px;color:#a9b4c6;font-size:8px;font-weight:500;letter-spacing:.32em}
main{width:min(100% - 40px,500px);margin:auto;padding:72px 0 82px;animation:rise .62s cubic-bezier(.2,.8,.2,1) both}.panel{position:relative;overflow:hidden;padding:42px 42px 38px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(21,28,41,.97),rgba(12,16,24,.97));box-shadow:0 26px 84px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.04)}.panel:before{position:absolute;top:0;left:12%;right:12%;height:1px;content:"";background:linear-gradient(90deg,transparent,rgba(113,157,255,.64),transparent)}.brand-mark{width:62px;height:62px;object-fit:contain;margin:0 auto 24px;display:block;filter:drop-shadow(0 8px 20px rgba(35,90,189,.3))}.eyebrow{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 13px;color:#8eb1ff;font-size:10px;font-weight:700;letter-spacing:.19em;text-transform:uppercase}.eyebrow:before{width:18px;height:1px;content:"";background:#6e9aff;opacity:.7}h1{margin:0;text-align:center;color:var(--ink);font-size:clamp(30px,6vw,38px);font-weight:600;letter-spacing:-.055em;line-height:1.15}.lede{max-width:355px;margin:13px auto 27px;text-align:center;color:var(--muted);font-size:14px;font-weight:300;line-height:1.75}.google-button{width:100%;min-height:54px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 18px;border:1px solid rgba(219,228,245,.18);border-radius:11px;background:linear-gradient(180deg,#f9fbff,#e9eef7);color:#1a2230;font-size:14px;font-weight:650;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}.google-button:hover{transform:translateY(-2px);background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.28)}.google-button:focus-visible,.brand:focus-visible{outline:2px solid #8fb2ff;outline-offset:4px}.google-icon{width:19px;height:19px;flex:0 0 19px}.privacy-note{margin:19px 0 0;text-align:center;color:#8793a7;font-size:11px;line-height:1.65}.message{min-height:20px;margin:13px 0 0;text-align:center;color:#f4bf82;font-size:12px}.message:empty{display:none}.foot{width:min(100% - 48px,1240px);margin:auto auto 0;padding:20px 0 23px;border-top:1px solid rgba(255,255,255,.065);color:#738096;font-size:11px}.foot a{color:#a4b3cd;text-decoration:none}.foot a:hover{color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes glow{from{opacity:.65;transform:translateX(-50%) scale(.92)}to{opacity:1;transform:translateX(-50%) scale(1.08)}}
@media(max-width:560px){.topbar,footer{width:calc(100% - 36px)}.topbar{height:70px}main{width:min(100% - 32px,500px);padding:48px 0 58px}.panel{padding:35px 24px 30px;border-radius:19px}.foot{width:calc(100% - 36px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Dash Media home">
      <img src="/logo.png" alt="">
      <span class="brand-name">DASH<span>MEDIA</span></span>
    </a>
  </header>
  <main>
    <section class="panel" aria-labelledby="title">
      <img class="brand-mark" src="/logo.png" alt="Dash Media">
      <p class="eyebrow">Client portal</p>
      <h1 id="title">Welcome back.</h1>
      <p class="lede">Sign in to see the agencies connected to your account.</p>
      <a class="google-button" href="/api/google-login">
        <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z" transform="translate(0 4)"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.95 46.98 31.82 46.98 24.55Z" transform="translate(0 0)"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.75-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.88.93 7.55 2.56 10.78l7.97-6.19Z" transform="translate(0 0)"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z" transform="translate(0 0)"/></svg>
        Continue with Google
      </a>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <p class="privacy-note">Your agency list is private and based on the verified email you use to sign in.</p>
    </section>
  </main>
  <footer class="foot"><span>© 2026 Dash Media</span><a href="mailto:hello@dashmediaco.com">Need help?</a></footer>
</div>
<script>
(function(){
  var messages={
    setup:'Dash sign-in is still being configured. Please contact Dash Media.',
    expired:'Your sign-in expired. Please sign in again.',
    cancelled:'Google sign-in was canceled.',
    unverified:'Use a Google account with a verified email address.',
    signin:'We could not complete sign-in. Please try again.'
  };
  var reason=new URLSearchParams(window.location.search).get('error');
  if(messages[reason])document.getElementById('message').textContent=messages[reason];
  fetch('/api/client-portals',{credentials:'same-origin',cache:'no-store'})
    .then(function(response){if(response.ok)window.location.replace('/agency');})
    .catch(function(){});
})();
</script>
</body>
</html>
