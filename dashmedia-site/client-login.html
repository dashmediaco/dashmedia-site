<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07090d">
<meta http-equiv="refresh" content="0;url=/api/client-login">
<title>Client sign-in | Dash Media</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 5%,rgba(29,78,216,.16),transparent 38rem),#07090d;color:#f6f7fa;font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,440px);padding:42px 34px;text-align:center;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:linear-gradient(145deg,#151922,#0d1016);box-shadow:0 24px 70px rgba(0,0,0,.45);animation:arrive .5s ease both}
img{width:56px;height:56px;object-fit:contain;margin-bottom:22px}
h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.04em}
p{margin:10px 0 26px;color:#aeb7c6;font-size:14px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 21px;border-radius:10px;background:#1d4ed8;color:#fff;font-size:14px;font-weight:600;text-decoration:none;box-shadow:0 8px 24px rgba(29,78,216,.24);transition:transform .18s ease,background .18s ease}
a:hover{transform:translateY(-1px);background:#285be0}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
<img src="/logo.png" alt="Dash Media">
<h1>Client sign-in</h1>
<p>Taking you to your secure Dash account sign-in.</p>
<a href="/api/client-login">Continue to sign in</a>
</main>
<script>window.location.replace("/api/client-login");</script>
</body>
</html>
